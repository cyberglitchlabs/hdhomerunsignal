# Supply-chain policy for the Rust workspace, checked in CI by cargo-deny.

[graph]
all-features = true

[advisories]
# Known vulnerabilities and unmaintained crates fail the build. An advisory that
# does not apply here can be ignored below, with the reason.
ignore = [
    # paste is unmaintained, with no replacement to move to. It is a build-time
    # proc-macro that utoipa-axum depends on, and it ships nothing at runtime.
    # Drop this when utoipa-axum stops using it.
    "RUSTSEC-2024-0436",
]

[licenses]
# Only permissive licences; anything else needs a deliberate decision here.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-root-certs, the trust store data
    "ISC",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

# The workspace crates are not published and the repository has no licence file.
private = { ignore = true }

[bans]
# Several versions of one crate are common while the ecosystem catches up; they
# are worth seeing but not worth failing for.
multiple-versions = "warn"
wildcards = "deny"
# Version requirements on workspace path dependencies are not wildcards.
allow-wildcard-paths = true

[sources]
# Crates come from crates.io and nowhere else.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
