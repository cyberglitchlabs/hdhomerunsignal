[package]
name = "hdhr-client"
description = "Talks to HDHomeRun devices: a swappable backend, the typed operations on top of it, and the cloud lookup."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
futures-util = "0.3.34"
hdhr-core = { version = "0.1.0", path = "../hdhr-core" }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["process", "time", "macros", "rt", "io-util"] }

[dev-dependencies]
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["test-util", "net", "rt-multi-thread", "io-util"] }
