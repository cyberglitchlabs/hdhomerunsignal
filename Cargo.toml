[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
# A smaller binary: the image only needs to run it.
strip = true
lto = "thin"
codegen-units = 1
