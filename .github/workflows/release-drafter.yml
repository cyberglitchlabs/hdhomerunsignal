name: Release Drafter

on:
  push:
    branches: [main]

permissions: {}

# Each run rebuilds the draft from all merged pull requests, so runs only need
# to be serialized, not kept per commit.
concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  update-release-draft:
    name: Update draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create or update the draft release
      pull-requests: read # read merged pull requests and their labels
    steps:
      - uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0 # v7.9.0
