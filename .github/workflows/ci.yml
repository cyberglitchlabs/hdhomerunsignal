name: CI

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_IMAGE: rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pull-image
        with:
          image: ${{ env.ACTIONLINT_IMAGE }}
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  frontend:
    name: Frontend test, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Generated API types are current
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts is out of date; run 'npm run api:types' in frontend/"
            exit 1
          }
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      HADOLINT_IMAGE: hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pull-image
        with:
          image: ${{ env.HADOLINT_IMAGE }}
      - name: hadolint
        run: |
          docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" \
            "$HADOLINT_IMAGE" < Dockerfile

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pull-image
        with:
          image: ${{ env.GITLEAKS_IMAGE }}
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo"
          "$GITLEAKS_IMAGE"
          git /repo --redact --no-banner

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  rust:
    name: Rust format, clippy and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup is on the runner. With no arguments it installs the toolchain that
      # rust-toolchain.toml pins, components included.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  rust-deny:
    name: Rust dependency policy and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Licences, sources and RustSec advisories, as set in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  e2e:
    name: End-to-end tests against the server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # rustup is on the runner. With no arguments it installs the toolchain that
      # rust-toolchain.toml pins, components included.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked -p hdhr-server
      # Black-box tests: they spawn the binary built above (the default
      # SERVER_CMD) with a fake hdhomerun_config and talk to it over HTTP.
      - name: Run the end-to-end tests
        working-directory: tests/e2e
        run: npm test

  image:
    name: Build, scan and smoke-test image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: hdhomerun-signal:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hdhomerun-signal:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test under restricted runtime settings
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -e HDHOMERUN_DISABLE_DISCOVERY=true \
            -p 3000:3000 hdhomerun-signal:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/v1/version; then
              # The image's own HEALTHCHECK command, run inside the container.
              docker exec smoke hdhr-server --healthcheck && exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1

  chart:
    name: Lint and validate Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
      KUBELINTER_IMAGE: ghcr.io/stackrox/kube-linter@sha256:f2bfce7879206d32f69ab6572c376f916643f54ca291ac38cf7d01ef591ff3f9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pull-image
        with:
          image: ${{ env.KUBECONFORM_IMAGE }}
      - uses: ./.github/actions/pull-image
        with:
          image: ${{ env.KUBELINTER_IMAGE }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: helm lint
        run: helm lint charts/hdhomerun-signal --strict --set 'hdhomerun.devices={192.0.2.10}'
      - name: Render chart scenarios
        run: |
          mkdir -p rendered/secure rendered/hostnetwork
          # Default, restricted-profile deployment with TLS ingress.
          helm template ci charts/hdhomerun-signal \
            --set 'hdhomerun.devices={192.0.2.10}' \
            --set ingress.enabled=true \
            --set 'ingress.tls[0].secretName=tls' \
            --set 'ingress.tls[0].hosts[0]=hdhomerun.example.com' \
            > rendered/secure/manifests.yaml
          # Opt-in hostNetwork discovery mode (validated for schema only).
          helm template ci charts/hdhomerun-signal \
            --set hostNetwork=true --set hdhomerun.discovery.enabled=true \
            > rendered/hostnetwork/manifests.yaml
          # Cloud discovery fallback switched off.
          mkdir -p rendered/nocloud
          helm template ci charts/hdhomerun-signal \
            --set 'hdhomerun.devices={192.0.2.10}' \
            --set hdhomerun.discovery.cloud=false \
            > rendered/nocloud/manifests.yaml
      - name: Check the cloud discovery setting reaches the container
        run: |
          # The fallback stays on by default and is only switched off on request.
          grep -A1 'name: HDHR_DISABLE_CLOUD_DISCOVERY' rendered/secure/manifests.yaml | grep -q 'value: "false"'
          grep -A1 'name: HDHR_DISABLE_CLOUD_DISCOVERY' rendered/nocloud/manifests.yaml | grep -q 'value: "true"'
          # A non-boolean value is rejected by the schema.
          if helm template ci charts/hdhomerun-signal --set 'hdhomerun.devices={192.0.2.10}' \
              --set hdhomerun.discovery.cloud=maybe >/dev/null 2>&1; then
            echo "expected the schema to reject hdhomerun.discovery.cloud=maybe" >&2
            exit 1
          fi
      - name: kubeconform
        run: >
          docker run --rm -v "$PWD/rendered:/m:ro"
          "$KUBECONFORM_IMAGE"
          -strict -summary /m/secure /m/hostnetwork /m/nocloud
      - name: kube-linter (default deployment)
        run: >
          docker run --rm -v "$PWD/rendered:/m:ro"
          "$KUBELINTER_IMAGE"
          lint /m/secure
      - name: Trivy misconfiguration scan (default deployment)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: rendered/secure
          severity: HIGH,CRITICAL
          exit-code: "1"
