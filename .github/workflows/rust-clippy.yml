# Runs clippy over the Rust workspace and uploads its findings to code scanning,
# so they show up as alerts next to CodeQL's. This reports; it does not gate.
# The gate is clippy with `-D warnings`, which runs with the other Rust checks.
#
# The two cargo tools below are third-party: clippy-sarif converts clippy's JSON
# to SARIF and sarif-fmt prints it. Both are pinned and installed with --locked.

name: rust-clippy analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 8 * * 2"

permissions: {}

# Superseded pull request runs are cancelled. Pushes to main and scheduled runs
# get a group of their own per commit so that every commit is analyzed.
concurrency:
  group: rust-clippy-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-clippy-analyze:
    name: Run rust-clippy analyzing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload the SARIF results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup is already on the runner; actions-rs/toolchain is archived.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable

      - name: Install SARIF tools
        run: cargo install --locked --version 0.8.0 clippy-sarif sarif-fmt

      - name: Run rust-clippy
        # Findings are reported below, not enforced here, so the step may not fail.
        continue-on-error: true
        run: |
          cargo clippy --workspace --all-targets --all-features --message-format=json \
            | clippy-sarif | tee rust-clippy-results.sarif | sarif-fmt

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: rust-clippy-results.sarif
          category: /tool:clippy
          wait-for-processing: true
