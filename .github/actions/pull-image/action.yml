name: Pull image with retries
description: >-
  Pulls a container image, retrying with a growing delay when the registry
  returns a transient error. Used for the tool images CI runs with docker run.

inputs:
  image:
    description: Image reference to pull (pin it by digest).
    required: true
  attempts:
    description: Maximum number of attempts.
    required: false
    default: "4"

runs:
  using: composite
  steps:
    - name: Pull ${{ inputs.image }}
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        ATTEMPTS: ${{ inputs.attempts }}
      run: |
        for attempt in $(seq 1 "$ATTEMPTS"); do
          if docker pull --quiet "$IMAGE"; then
            exit 0
          fi
          if [ "$attempt" -lt "$ATTEMPTS" ]; then
            delay=$((attempt * 10))
            echo "::warning::pulling $IMAGE failed (attempt $attempt of $ATTEMPTS); retrying in ${delay}s"
            sleep "$delay"
          fi
        done
        echo "::error::could not pull $IMAGE after $ATTEMPTS attempts"
        exit 1
