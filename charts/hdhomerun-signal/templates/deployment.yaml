{{- include "hdhomerun-signal.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hdhomerun-signal.fullname" . }}
  labels:
    {{- include "hdhomerun-signal.labels" . | nindent 4 }}
spec:
  # Single replica: the app holds per-connection state against the tuners.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hdhomerun-signal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hdhomerun-signal.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "hdhomerun-signal.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "hdhomerun-signal.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: HDHOMERUN_DISABLE_DISCOVERY
              value: {{ ternary "false" "true" .Values.hdhomerun.discovery.enabled | quote }}
            - name: HDHR_DISABLE_CLOUD_DISCOVERY
              value: {{ ternary "false" "true" .Values.hdhomerun.discovery.cloud | quote }}
            {{- if .Values.hdhomerun.devices }}
            - name: HDHOMERUN_DEVICES
              value: {{ join "," .Values.hdhomerun.devices | quote }}
            {{- end }}
            {{- if .Values.allowedOrigins }}
            - name: HDHR_ALLOWED_ORIGINS
              value: {{ join "," .Values.allowedOrigins | quote }}
            {{- end }}
            {{- $trustProxy := toString (default "" .Values.trustProxy) }}
            {{- if $trustProxy }}
            - name: HDHR_TRUST_PROXY
              value: {{ $trustProxy | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
