{{- /* NetworkPolicy does not apply to hostNetwork pods, so it is not rendered for them. */}}
{{- if and .Values.networkPolicy.enabled (not .Values.hostNetwork) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hdhomerun-signal.fullname" . }}
  labels:
    {{- include "hdhomerun-signal.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hdhomerun-signal.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingress.from }}
        {{- toYaml .Values.networkPolicy.ingress.from | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- $ips := list }}
    {{- range .Values.hdhomerun.devices }}
    {{- if regexMatch "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$" . }}
    {{- $ips = append $ips . }}
    {{- end }}
    {{- end }}
    {{- if $ips }}
    # Tuners: hdhomerun_config control and discovery protocol.
    - to:
        {{- range $ips }}
        - ipBlock:
            cidr: {{ . }}/32
        {{- end }}
      ports:
        - protocol: TCP
          port: 65001
        - protocol: UDP
          port: 65001
    {{- end }}
    {{- with .Values.networkPolicy.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
